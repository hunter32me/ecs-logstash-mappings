# Corelight ECS Logstash Pipeline
# Add this file to the installed Logstash pipeline filter directory.
# Expects the common 3101 filter to set labels.corelight.event_sub_type.

filter {
  if [@metadata][z_no_reuse][event_type] == "corelight" and [labels][corelight][event_sub_type] == "first_seen" {
    mutate {
      update => {
        "[event][kind]" => "event"
        "[event][category]" => "network"
        "[event][type]" => "info"
        "[labels][corelight][event_category]" => "network_observations"
        "[@metadata][temporary_metadata_index_name_type]" => "VAR_CL_DS_TYPE_PROTOCOL_LOG"
        "[@metadata][temporary_metadata_index_name_dataset_prefix]" => "VAR_CL_DS_PREFIX_PROTOCOL_LOG"
        "[@metadata][temporary_metadata_index_name_dataset_suffix]" => "VAR_CL_DS_SUFFIX_PROTOCOL_LOG_VARIOUS"
        "[@metadata][temporary_metadata_index_name_namespace]" => "VAR_CL_DS_NAMESPACE_PROTOCOL_LOG"
      }
      rename => {
        "entity" => "[first_seen][entity]"
        "original_entity" => "[first_seen][original_entity]"
        "first_seen_type" => "[first_seen][type]"
        "history" => "[first_seen][history_seconds]"
        "history_days" => "[first_seen][history_days]"
        "item" => "[first_seen][item]"
        "use_case" => "[first_seen][use_case]"
        "use_case_description" => "[first_seen][use_case_description]"
      }
      add_field => {
        "[@metadata][etl][pipeline]" => "filter-mutate-first_seen-2026102701"
      }
      tag_on_failure => "_mutate_error-first_seen-2026102701"
      id => "filter-mutate-first_seen-2026102701"
    }
  }
}